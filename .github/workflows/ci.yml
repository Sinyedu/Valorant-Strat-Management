name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Local MongoDB in Docker: fast and independent of Atlas.
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    env:
      # DB name must contain "test": integration tests refuse any other name.
      MONGODB_TEST_URI: mongodb://localhost:27017/vsmp_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null; then
              echo "MongoDB is accepting connections"
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB did not start in time" >&2
          docker ps -a
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: pnpm test:e2e
        env:
          # Throwaway database in the service container; the name must contain "e2e".
          E2E_MONGODB_URI: mongodb://localhost:27017/vsmp_e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
